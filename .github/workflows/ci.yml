name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A branch pushed three times in a minute is three runs measuring two revisions
# nobody will look at again. The newest push is the only one whose answer is
# wanted; `main` is exempt, because its runs are the record.
#
# Everything here is free: compilation, tests and an image build. Nothing in
# this file starts an agent or spends a token, and that is deliberate — the
# conformance suite runs real agent tasks against a real CLI, and a job that
# bills a maintainer for every push is one they turn off rather than trust.
# GitHub also withholds secrets from a fork's pull request, so a remote gate
# could never have measured a contribution anyway. It runs on a maintainer's
# machine before a merge instead; see docs/conformance.md.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 1.24, not the 1.22 in go.mod. go.mod states the floor this module
          # supports; this states what CI builds with, and 1.22 stopped getting
          # security patches — govulncheck reports 32 stdlib advisories against
          # it. Raising the build toolchain fixes those without raising the
          # floor for anyone consuming the module.
          go-version: '1.24'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: make fmt-check

      - name: Test
        run: go test ./... -race -cover

      # The scripts that defend the conformance score are checked here too, for
      # the same reason the Go tests are: they are free, and stdlib unittest
      # needs nothing installed. This also catches a pin moved in the Makefile
      # and not in docs/conformance.md, which is the two-places-one-number
      # failure #109 exists to stop.
      - name: Test the conformance scripts
        run: make test-scripts

  # Lint and security are their own job so a failing linter does not hide a
  # failing test, and vice versa. Every tool version here is pinned in the
  # Makefile and read from it, never repeated: a number written twice is a
  # number that eventually disagrees with itself.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, and a shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Install pinned Go tools
        run: make tools

      - name: Install gitleaks
        run: |
          v="$(make -s gitleaks-version)"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Lint
        run: make lint

      # gosec and gitleaks gate. govulncheck reports: a stdlib advisory is
      # usually fixed by a toolchain bump rather than by anything in this
      # repository, and a gate nobody in a pull request can pass is a gate that
      # gets switched off. Set GOVULNCHECK_STRICT=1 to make it gate too.
      - name: Security scan
        run: make security-push

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Building the image here is what turns a broken one into a red build
      # rather than a 500 on the first request that reaches for a harness CLI.
      - name: Build and check the image
        run: make docker-check
