name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: make fmt-check

      - name: Test
        run: go test ./... -race -cover

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Building the image here is what turns a broken one into a red build
      # rather than a 500 on the first request that reaches for a harness CLI.
      - name: Build and check the image
        run: make docker-check
