# golangci-lint for uhp-go.
#
# Calibrated the same way as namux: security stays on, noisy style rules that
# fight server/IO patterns are dialled back. The version is pinned in the
# Makefile (GOLANGCI_VERSION) rather than tracking @latest, because this file
# is v1 schema and a linter that silently changes its rule set turns a green
# build into an argument.
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 3m
  modules-download-mode: readonly
  allow-parallel-runners: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - unconvert
    - gocyclo
    - gosec
    - stylecheck

linters-settings:
  errcheck:
    # check-blank=false: allow intentional `_ = f.Close()` / best-effort
    # cleanup. Completely ignored error returns are still flagged.
    check-blank: false
    check-type-assertions: true
    exclude-functions:
      # Writes to stdout/stderr are best-effort; a failure is a broken pipe,
      # which is not something this server can act on.
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
      - fmt.Print
      - fmt.Printf
      - fmt.Println

  govet:
    enable-all: false

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/aenawi/uhp-go

  gocyclo:
    min-complexity: 30

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: indent-error-flow
      - name: errorf

  gosec:
    # No excludes. Every finding this repository accepts carries an inline
    # `#nosec <rule> -- reason` at the site, so a new exec or file read that
    # nobody has thought about still fails the build. That is also what
    # tagtastic's .gosec.yaml asks for.
    excludes: []

  stylecheck:
    # ST1022 joins the list for the same reason as the others: it wants
    # "CodePrefix ..." on a comment that introduces a whole const block, and
    # the prose here is worth more than the convention.
    checks: ["all", "-ST1000", "-ST1003", "-ST1023", "-ST1022"]

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
        # A test that exercises a deprecated field has to mention it, and a
        # helper kept beside a table nobody reads today is not a defect worth
        # a build failure.
        - staticcheck
        - unused

    - linters:
        - govet
      text: 'shadow: declaration of "err"'

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
